# 日志等级 trace,debug,info,warn,fatal,mark,error,off
log_level: info
# 单条日志长度
log_length: 10000
# 对象日志格式
log_object: true
# 日志ID对齐
log_align: "  Rabbit  "
# 将错误级别误用为成功信息时，自动纠偏为 info
# 某些第三方/插件会错误使用 error 打印“创建成功/认证成功”等信息
# 开启本开关后，包含“成功/已启动/初始化完成/认证成功/连接成功”等关键词的 error 日志会降级为 info
log_auto_fix_success_level: true
# 插件加载超时
plugin_load_timeout: 60
# 监听文件变化
file_watch: true

# 自动更新时间
update_time: 1440
# 自动重启时间
restart_time: 0
# 定时更新cron表达式
update_cron:
# 定时重启cron表达式
restart_cron:
# 定时关机cron表达式
stop_cron:
# 定时开机cron表达式
start_cron:

# 缓存群成员列表
cache_group_member: true
# 上线推送通知的冷却时间
online_msg_exp: 1440
# 文件保存时间
file_to_url_time: 1
# 文件访问次数
file_to_url_times:
# 消息类型统计
msg_type_count: false
# 以/开头转为#
/→#: true

# chromium其他路径
chromium_path:
# puppeteer接口地址
puppeteer_ws:
# puppeteer截图超时时间
puppeteer_timeout:

# 米游社接口代理地址，国际服用
proxyAddress: